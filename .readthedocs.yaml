# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Required by Read the Docs; the docs environment itself comes from pixi.
    python: "3.13"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi 0.84.2
      - asdf global pixi 0.84.2
    install:
      - pixi install --locked
    build:
      html:
        - pixi run --locked docs $READTHEDOCS_OUTPUT/html
