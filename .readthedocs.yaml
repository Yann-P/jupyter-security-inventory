# Read the Docs builds the site with pixi, from the same dependencies as everyone else.
version: 2
build:
  os: ubuntu-24.04
  commands:
    - mkdir -p $HOME/bin
    - curl -fsSL https://github.com/prefix-dev/pixi/releases/download/v0.84.2/pixi-x86_64-unknown-linux-musl.tar.gz | tar xz -C $HOME/bin
    - $HOME/bin/pixi run docs $READTHEDOCS_OUTPUT/html
