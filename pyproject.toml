[project]
name = "jupyter-security-inventory"
version = "1.0"
license = "BSD-3-Clause"
requires-python = ">=3.14"
dependencies = ["openai==3.36.1", "pydantic==2.14.1", "pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "pre-commit==4.7.0"]
docs = [
    "sphinx==9.2.0",
    "pydata-sphinx-theme==0.23.0",
    "myst-parser==5.1.0",
    "sphinx-datatables==1.0.0",
    "sphinxcontrib-jquery==4.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts", "docs"]  # so that the tests can import the scripts and docs/insights.py
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip() without strict=
