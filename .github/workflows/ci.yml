# Runs the formatting checks, the tests and a syntax check of the page's JavaScript, and checks that the committed
# site data is exactly what the committed code produces.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install . --group dev
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: pytest
      - name: Check the syntax of the page's JavaScript
        run: |
          # The files are ES modules: without --input-type=module, node --check skips the errors in those that import.
          for file in site/*.js; do
            node --input-type=module --check < "$file" || { echo "::error::Syntax error in $file"; exit 1; }
          done
      - name: Check that site/data/ is up to date
        run: |
          python scripts/5_build_dataset.py
          git diff --exit-code site/data || {
            echo "::error::site/data/ is out of date: run python scripts/5_build_dataset.py and commit the result."
            exit 1
          }
