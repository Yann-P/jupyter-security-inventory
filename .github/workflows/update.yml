# Every day: rebuilds the inventory, commits what changed in output/, and republishes the site.
# Step 4 only labels new repos (see scripts/4_classify.py), so a daily run costs few tokens.
# Needs a DEEPSEEK_API_KEY repository secret.
name: Update

on:
  schedule:
    - cron: "17 5 * * *"  # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # unlike the other workflows: this one pushes output/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install .
      - run: python scripts/1_inventory.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/2_scan_repos.py --clone-dir "$RUNNER_TEMP/clones"
      - run: python scripts/3_packages.py
      - run: python scripts/4_classify.py --clone-dir "$RUNNER_TEMP/clones"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - run: python scripts/5_build_dataset.py
      - run: python scripts/6_table.py
      - name: Commit output/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || { git commit -m "Update the inventory"; git push; }

  # A push made with the workflow's own token doesn't start other workflows, so publish the site here.
  docs:
    needs: update
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
